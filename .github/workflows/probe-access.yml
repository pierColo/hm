name: Diagnostica accesso H&M
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Linux Chromium con interfaccia virtuale
        if: runner.os == 'Linux'
        run: xvfb-run -a python probe_access.py --headed
      - name: Windows Chromium
        if: runner.os == 'Windows'
        run: python probe_access.py
